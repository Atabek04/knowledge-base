# Builds the public wiki with Quartz and deploys it to GitHub Pages from this
# repo's own Actions run. Site: https://atabek04.github.io/knowledge-base
#
# Only the folders not listed under ignorePatterns in site/quartz.config.yaml
# are rendered. One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Publish wiki

on:
  push:
    branches: [main]
    paths:
      - "01-MOCs/**"
      - "02-Zettelkasten/**"
      - "Incidents/**"
      - "Assets/**"
      - "site/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so Quartz can read created/modified dates from git

      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v5
          path: quartz

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Quartz dependencies
        uses: actions/cache@v4
        with:
          path: |
            quartz/node_modules
            quartz/.quartz
          key: quartz-${{ runner.os }}-${{ hashFiles('quartz/package-lock.json', 'site/quartz.config.yaml') }}

      - name: Overlay site config
        run: |
          cp site/quartz.config.yaml site/quartz.ts quartz/
          cp site/custom.scss quartz/quartz/styles/custom.scss
          cp site/index.md index.md

      - name: Build
        working-directory: quartz
        run: |
          npm ci
          npx quartz plugin install --from-config
          npx quartz build -d ..

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
