# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
# Copied over the Quartz checkout at build time (see .github/workflows/publish.yml).
# The content root is the vault itself (quartz build -d <vault>); everything not
# meant for the public site is listed under ignorePatterns.
configuration:
  pageTitle: Knowledge Base
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: atabek04.github.io/kb
  ignorePatterns:
    # working folders, never published
    - 00-Inbox
    - 05-Flashcards
    - Templates
    - scripts
    - emojis
    - site
    - quartz
    # root-level tooling files
    - CLAUDE.md
    - README.md
    - LICENSE
    # Dataview dashboard, meaningless outside Obsidian
    - 01-MOCs/Inbox Review Dashboard.md
    # copyrighted PDFs
    - Assets/Books
    # dotfolders (globby skips them anyway; listed for clarity)
    - .obsidian
    - .claude
    - .github
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Fraunces
      body: Inter
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#fbfaf7"
        lightgray: "#e6e3dc"
        gray: "#b5b1a8"
        darkgray: "#4a4842"
        dark: "#1f1e1b"
        secondary: "#2f5d8a"
        tertiary: "#7a9e7e"
        highlight: rgba(47, 93, 138, 0.10)
        textHighlight: "#ffe06688"
      darkMode:
        light: "#171717"
        lightgray: "#2b2b2b"
        gray: "#5c5c5c"
        darkgray: "#d6d3cc"
        dark: "#f0ede6"
        secondary: "#8ab4e0"
        tertiary: "#9bc79f"
        highlight: rgba(138, 180, 224, 0.12)
        textHighlight: "#b3aa0288"

plugins:
  # ── transformers ──────────────────────────────────────────
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority: [frontmatter, git, filesystem]
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    options:
      maxDepth: 4
      minEntries: 2
      collapseByDefault: false
    order: 50
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: mathjax
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
  - source: "@quartz-community/ox-hugo"
    enabled: false
  - source: "@quartz-community/roam"
    enabled: false
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false

  # ── filters ───────────────────────────────────────────────
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false

  # ── emitters ──────────────────────────────────────────────
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: false
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: false
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: false
  - source: "@quartz-community/bases-page"
    enabled: false
  - source: "@quartz-community/encrypted-pages"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    order: 45
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true

  # ── left sidebar: title, toolbar, subject tree ────────────
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/spacer"
    enabled: true
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      title: Browse
      folderClickBehavior: link
      folderDefaultState: collapsed
      useSavedState: true
    layout:
      position: left
      priority: 50

  # ── right sidebar: headings, graph, backlinks ─────────────
  - source: "@quartz-community/graph"
    enabled: true
    options:
      localGraph:
        depth: 1
        scale: 1.1
        showTags: false
      globalGraph:
        showTags: false
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50

  # ── above the body ────────────────────────────────────────
  - source: "@quartz-community/breadcrumbs"
    enabled: false
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
      condition: has-tags
  # Also the frontmatter parser: must stay enabled. The visual panel is hidden.
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      hidePropertiesView: true
      includeAll: false
      includedProperties: []
      excludedProperties: []
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all

  # ── misc ──────────────────────────────────────────────────
  - source: "@quartz-community/comments"
    enabled: false
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/stacked-pages"
    enabled: false
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/Atabek04
    layout:
      position: footer
      priority: 50

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude: [reader-mode]
      positions:
        right: []
    tag:
      exclude: [reader-mode]
      positions:
        right: []
